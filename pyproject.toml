[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tigv"
version = "0.1.0"
description = "A keyboard-driven terminal genome browser"
requires-python = ">=3.11"
dependencies = ["pysam>=0.22", "pyBigWig>=0.3.22"]

[project.scripts]
tigv = "tigv.app:main"

[tool.setuptools.packages.find]
include = ["tigv*"]
